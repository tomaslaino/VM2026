name: Synka slutspelssannolikheter

# Bygger data/bracket_probs.json med SAMMA motor som frontend:
# scripts/prob/gen_bracket_probs.mjs kör assets/bracketengine.js på
# data/results.json + data/odds.json + data/winner_odds.json med samma antal
# simuleringar och seed som webbläsaren. Den statiska filen (fallbacken och
# Renders /api/bracketprobs) kan därmed aldrig visa andra siffror än sidan
# själv räknar fram lokalt. (Ersätter den gamla Python-motorn
# vm_sannolikheter.py, som byggde på en annan modell och gav andra siffror.)
#
# Tre triggers, två lägen (sparar månadskvoten på odds-API:t):
#   * schedule "0 */6 * * *"        -> FÄRSKA vinnarodds (outright), var 6:e timme.
#   * repository_dispatch            -> resultat-synken (sync-results.yml) skickar
#     (results-updated)                "results-updated" direkt när nya resultat
#                                      committats. Räknar bara OM simuleringen på
#                                      de nya resultaten – ingen odds-API, gratis.
#   * workflow_dispatch              -> manuell körning, hämtar alltid färska odds.
#
# Kräver repo-secret ODDS_API_KEY för marknadsodds. Saknas den behålls senaste
# data/winner_odds.json (eller FIFA-ranking-fallbacken om filen saknas helt) –
# sidan fungerar ändå, men med äldre/modellerade i stället för färska odds.

on:
  schedule:
    - cron: "0 */6 * * *"     # färska odds var 6:e timme
  repository_dispatch:
    types: [results-updated]  # omräkning direkt vid nya resultat (ingen API-kostnad)
  workflow_dispatch: {}

concurrency:
  group: sync-bracket-probs
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Vinnarodds läses/skrivs på SAMMA fil som frontend hämtar – en enda sanning.
  VM_WINNER_ODDS: data/winner_odds.json
  VM_BRACKET_OUTPUT: data/bracket_probs.json
  VM_N_SIMS: "40000"        # = SIM_N i assets/app.js – ändra inte ena utan andra

jobs:
  probs:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Avgör om färska odds ska hämtas
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 */6 * * *" ]; then
            echo "fetch=1" >> "$GITHUB_OUTPUT"
          else
            echo "fetch=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Generera FIFA-karta + lagtabell (ur data.js/annexc.js)
        run: |
          node scripts/prob/gen_bracket_map.mjs
          # Frontend + generator läser data/bracket_map.json – håll kopian i synk.
          cp scripts/prob/bracket_map.json data/bracket_map.json

      - name: Bootstrap-vinnarodds (endast om data/winner_odds.json saknas)
        run: |
          if [ ! -f data/winner_odds.json ]; then
            node scripts/prob/gen_fallback_outrights.mjs
            cp scripts/prob/vinnarodds.json data/winner_odds.json
          fi

      - name: Sätt upp Python (för odds-hämtning)
        if: steps.gate.outputs.fetch == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta vinnarodds (outright) – endast vid odds-hämtning
        if: steps.gate.outputs.fetch == '1'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          pip install requests
          python scripts/prob/vm_vinnarodds.py
          # Spegla till scripts/prob för verktyg som läser den gamla platsen.
          cp data/winner_odds.json scripts/prob/vinnarodds.json

      - name: Kör sannolikhetsmotorn (samma motor som frontend)
        run: node scripts/prob/gen_bracket_probs.mjs

      - name: Committa om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add på katalog (inte enskilda filer) – tål att t.ex. genererade filer saknas.
          git add data/bracket_probs.json data/winner_odds.json data/bracket_map.json scripts/prob
          if git diff --staged --quiet; then
            echo "Inga förändringar – hoppar över commit."
            exit 0
          fi
          git commit -m "Auto-synk slutspelssannolikheter $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Resultat-synken pushar ofta till main – rebasa och försök igen vid kapplöpning.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Push OK (försök $i)."
              exit 0
            fi
            echo "Push misslyckades (kapplöpning?) – försök $i, väntar 5 s…"
            sleep 5
          done
          echo "Kunde inte pusha efter 5 försök."
          exit 1
