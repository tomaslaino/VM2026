name: Synka SVT/TV4-höjdpunkter

# Hämtar länkar till repriser + sammandrag (hela matchen, längre/kortare
# sammandrag) för spelade matcher samt livesändning/försnack för pågående och
# strax kommande matcher från SVT Play och TV4 Play, och committar
# data/highlights.json som matchmodalen läser. Länkar dyker upp och försvinner
# av sig själva i takt med att sändningar/klipp publiceras/tas bort hos SVT/TV4.

on:
  # VM 2026 är färdigspelat – cron-schemat borttaget 2026-07-22.
  # Kör manuellt via workflow_dispatch vid behov.
  workflow_dispatch: {} # Tillåt manuell körning från Actions-fliken.

concurrency:
  group: sync-highlights
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installera beroenden
        run: npm ci --no-audit --no-fund

      - name: Hämta höjdpunkter från SVT & TV4
        run: node server/scripts/syncHighlights.js

      - name: Committa om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/highlights.json
          if git diff --staged --quiet; then
            echo "Inga förändringar – hoppar över commit."
            exit 0
          fi
          git commit -m "Auto-synk SVT/TV4-höjdpunkter $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Resultat-workflowen pushar varje minut till samma branch – försök med
          # rebase + retry så att en samtidig push inte får den här att faila.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push klar."
              exit 0
            fi
            echo "Push avvisad (försök $i) – rebasar mot senaste main…"
            git pull --rebase --autostash origin main || true
          done
          echo "Kunde inte pusha efter flera försök." >&2
          exit 1
