name: Synka troliga startelvor

# Hämtar troliga (och senare bekräftade) startelvor för kommande VM-matcher
# från 365Scores öppna webb-API och committar data/lineups_prelim.json som
# matchmodalens "Laguppställning"-flik läser före avspark.

on:
  schedule:
    # Var 15:e minut – troliga elvor ändras sällan men slår om till
    # "bekräftad" ~1 timme före avspark, och det vill vi fånga snabbt.
    # Skriptet skriver bara om filen (→ commit) när något faktiskt ändrats.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # Tillåt manuell körning från Actions-fliken.

concurrency:
  group: sync-lineups
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Hämta troliga startelvor
        run: node server/scripts/syncLineups.js

      - name: Committa om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lineups_prelim.json
          if git diff --staged --quiet; then
            echo "Inga förändringar – hoppar över commit."
            exit 0
          fi
          git commit -m "Auto-synk troliga startelvor $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Resultat-workflowen pushar ofta till samma branch – rebase + retry
          # så att en samtidig push inte får den här att faila.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push klar."
              exit 0
            fi
            echo "Push avvisad (försök $i) – rebasar mot senaste main…"
            git pull --rebase --autostash origin main || true
          done
          echo "Kunde inte pusha efter flera försök." >&2
          exit 1
