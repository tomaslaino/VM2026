name: Synka spelarmetrik

# Bygger data/wc2026_player_metrics.json: betting-relevant spelardata som inte
# finns någon annanstans på sidan – marknadsvärde + spelarporträtt
# (Transfermarkt) och klubbform 2025/26, matcher och mål (Wikipedia). Ingen
# API-nyckel. Skriptet cachar uppslag (TM-id/Wikipedia-titel) och är resumbart,
# så varje körning fyller på det som saknas eller ändrats.

on:
  schedule:
    # En gång om dygnet (03:17 UTC) – marknadsvärden och säsongsstatistik ändras
    # långsamt, och körningen gör många anrop mot Transfermarkt/Wikipedia som
    # inte ska hamras. En full körning tar en dryg timme.
    - cron: "17 3 * * *"
  workflow_dispatch: {} # Tillåt manuell körning från Actions-fliken.

concurrency:
  group: sync-player-metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Ge körningen gott om tid – 1248 spelare med snälla pauser mellan anropen.
    timeout-minutes: 180
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Hämta marknadsvärde + klubbform per spelare
        run: node server/scripts/syncPlayerMetrics.js

      - name: Committa om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wc2026_player_metrics.json
          if git diff --staged --quiet; then
            echo "Inga förändringar – hoppar över commit."
            exit 0
          fi
          git commit -m "Auto-synk spelarmetrik $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Andra workflows pushar ofta till samma branch – rebase + retry så att
          # en samtidig push inte får den här att faila.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push klar."
              exit 0
            fi
            echo "Push avvisad (försök $i) – rebasar mot senaste main…"
            git pull --rebase --autostash origin main || true
          done
          echo "Kunde inte pusha efter flera försök." >&2
          exit 1
