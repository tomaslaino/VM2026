name: Synka spelarstatus

# Hämtar skador/avstängningar/osäkra spelare från API-Football och committar
# data/wc2026_player_status.json som sidan (GitHub Pages) läser direkt.
#
# Kräver repo-hemligheten API_FOOTBALL_KEY. Saknas nyckeln gör skriptet INGET
# (offline-läge) och workflowen avslutas grönt utan ändringar.
# Körs var 3:e timme (fram till 2026-07-19) samt manuellt.

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-player-status
  cancel-in-progress: false

jobs:
  sync-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Kontrollera datumfönster (cron stoppar efter 2026-07-19)
        id: window
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y-%m-%d)" \> "2026-07-19" ]; then
            echo "Förbi 2026-07-19 – hoppar över schemalagd körning."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sätt upp Node
        if: steps.window.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installera beroenden
        if: steps.window.outputs.proceed == 'true'
        run: npm ci --no-audit --no-fund

      - name: Hämta spelarstatus från API-Football
        if: steps.window.outputs.proceed == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_PROVIDER: ${{ vars.API_FOOTBALL_PROVIDER }}
          WC_LEAGUE_ID: ${{ vars.WC_LEAGUE_ID }}
          WC_SEASON: ${{ vars.WC_SEASON }}
        run: npm run sync:status

      - name: Committa om filen ändrats
        if: steps.window.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/wc2026_player_status.json; then
            echo "Inga ändringar i spelarstatusen – ingen commit."
          else
            git add data/wc2026_player_status.json
            git commit -m "chore: uppdatera spelarstatus (auto)"
            git push
          fi
