name: Synka spelartillgänglighet

# Bygger data/wc2026_player_status.json – vilka spelare som inte spelar
# (avstängda/skadade) eller är osäkra inför lagets nästa match, med källa:
#   · avstängningar beräknas ur officiell matchdata (results/matchdetails)
#   · skador/frågetecken ur respektive lands medier via Google Nyheter-RSS
# Ingen API-nyckel behövs. Manuella poster (manual: true) bevaras.
# Körs varje timme (fram till 2026-07-19) samt manuellt.

on:
  # VM 2026 är färdigspelat – cron-schemat borttaget 2026-07-22.
  # Kör manuellt via workflow_dispatch vid behov.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-player-status
  cancel-in-progress: false

jobs:
  sync-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Kontrollera datumfönster (cron stoppar efter 2026-07-19)
        id: window
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y-%m-%d)" \> "2026-07-19" ]; then
            echo "Förbi 2026-07-19 – hoppar över schemalagd körning."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sätt upp Node
        if: steps.window.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bygg spelartillgängligheten
        if: steps.window.outputs.proceed == 'true'
        run: npm run sync:availability

      - name: Committa om filen ändrats
        if: steps.window.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/wc2026_player_status.json; then
            echo "Inga ändringar i spelartillgängligheten – ingen commit."
            exit 0
          fi
          git add data/wc2026_player_status.json
          git commit -m "Auto-synk spelartillgänglighet $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Resultat-workflowen pushar ofta till samma branch – rebase + retry
          # så att en samtidig push inte får den här att faila.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push klar."
              exit 0
            fi
            echo "Push avvisad (försök $i) – rebasar mot senaste main…"
            git pull --rebase --autostash origin main || true
          done
          echo "Kunde inte pusha efter flera försök." >&2
          exit 1
