name: Synka VM-resultat

# Hämtar matchresultat, schema & matchstatistik från ESPN:s öppna API
# (ingen API-nyckel behövs) och committar statiska data/results.json +
# data/matchdetails.json som sidan (GitHub Pages) läser direkt.

on:
  # VM 2026 är färdigspelat – cron-schemat borttaget 2026-07-22.
  # Kör manuellt via workflow_dispatch vid behov.
  workflow_dispatch: {} # Tillåt manuell körning från Actions-fliken.

# Undvik överlappande körningar.
concurrency:
  group: sync-results
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # tillåter att starta sannolikhets-workflowen vid nya resultat

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installera beroenden
        run: npm ci --no-audit --no-fund

      - name: Spara results före synk
        run: cp data/results.json /tmp/results-before.json

      - name: Hämta resultat från ESPN
        env:
          SYNC_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: npm run sync:static

      - name: Committa om något ändrats
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/matchdetails.json
          if git diff --staged --quiet; then
            echo "Inga förändringar – hoppar över commit."
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-synk VM-resultat $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      # Räkna om slutspelssannolikheterna DIREKT när nya resultat kom in.
      # GitHubs schemalagda "*/30"-cron hoppas ofta över under hög last, så
      # probs kunde släpa flera timmar efter ett resultat. Vi triggar i stället
      # sannolikhets-workflowen så fort (och bara när) resultaten faktiskt ändrats.
      - name: Trigga omräkning av sannolikheter
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAYLOAD=$(node scripts/detectResultChanges.mjs /tmp/results-before.json data/results.json)
          gh api --method POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=results-updated \
            -f "client_payload=$PAYLOAD"
