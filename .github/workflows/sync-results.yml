name: Synka VM-resultat

# Hämtar matchresultat, schema & matchstatistik från ESPN:s öppna API
# (ingen API-nyckel behövs) och committar statiska data/results.json +
# data/matchdetails.json som sidan (GitHub Pages) läser direkt.

on:
  schedule:
    # Varje minut – skriptet self-throttlar (shouldSyncNow): hämtar ESPN varje
    # körning när en match är live/snart/nyligen, men hoppar över API-anropet i
    # lugna perioder (matchdag max var 5:e min, idle var 30:e). Resultatet:
    # tätare uppdateringar under matcher utan onödiga anrop däremellan.
    - cron: "* * * * *"
  workflow_dispatch: {} # Tillåt manuell körning från Actions-fliken.

# Undvik överlappande körningar.
concurrency:
  group: sync-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installera beroenden
        run: npm ci --no-audit --no-fund

      - name: Hämta resultat från ESPN
        env:
          SYNC_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: npm run sync:static

      - name: Committa om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/matchdetails.json
          if git diff --staged --quiet; then
            echo "Inga förändringar – hoppar över commit."
          else
            git commit -m "Auto-synk VM-resultat $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
