name: Synka landslagsnyheter

# Hämtar senaste nyheterna om varje landslag från respektive lands egna medier
# (Google Nyheter-RSS med lokala sökfrågor per lag) och committar
# data/team_news.json som matchmodalens inför-snack läser.

on:
  schedule:
    # Varannan timme – nyhetsflödet behöver inte vara sekundfärskt och
    # Google Nyheter ska inte hamras i onödan.
    - cron: "41 */2 * * *"
  workflow_dispatch: {} # Tillåt manuell körning från Actions-fliken.

concurrency:
  group: sync-team-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Hämta nyheter per land
        run: node server/scripts/syncTeamNews.js

      - name: Committa om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/team_news.json
          if git diff --staged --quiet; then
            echo "Inga förändringar – hoppar över commit."
            exit 0
          fi
          git commit -m "Auto-synk landslagsnyheter $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Resultat-workflowen pushar ofta till samma branch – rebase + retry
          # så att en samtidig push inte får den här att faila.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push klar."
              exit 0
            fi
            echo "Push avvisad (försök $i) – rebasar mot senaste main…"
            git pull --rebase --autostash origin main || true
          done
          echo "Kunde inte pusha efter flera försök." >&2
          exit 1
