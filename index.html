<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VM 2026 – Grupper, Slutspel & Kalender</title>
  <meta name="description" content="Följ fotbolls-VM 2026 (USA, Mexiko, Kanada). Grupptabeller, slutspelsträd och kalender som uppdateras automatiskt och i realtid.">
  <meta name="theme-color" content="#0a1628">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/logo-spade.png?v=2" type="image/png" sizes="128x128">
  <link rel="apple-touch-icon" href="assets/logo-spade.png?v=2">
  <link rel="preconnect" href="https://flagcdn.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=157">
</head>
<body>
  <div class="site-bg" aria-hidden="true"></div>
  <header class="hero-header">
    <div class="topbar">
      <div class="topbar-inner">
        <a class="brand" data-nav="home" role="link" tabindex="0" title="Till startsidan" aria-label="Gräver grav – startsidan">
          <span class="brand-mark" aria-hidden="true">
            <img src="assets/logo-spade.png?v=1" width="36" height="36" alt="" decoding="async">
          </span>
          <span class="brand-txt"><b>Gräver grav</b><small>VM 2026</small></span>
        </a>

        <nav class="nav" aria-label="Vyer">
          <button class="seg" data-nav="home">Hem</button>
          <button class="seg" data-nav="groups">Gruppspel</button>
          <button class="seg" data-nav="bracket">Slutspel</button>
          <button class="seg" data-nav="r32">Kalkylator</button>
          <button class="seg" data-nav="calendar">Kalender</button>
          <button class="seg" data-nav="players">Statistik</button>
        </nav>

        <div class="search" role="search">
          <input id="teamSearch" type="search" autocomplete="off" placeholder="Sök…" aria-label="Sök">
          <div id="searchResults" class="search-results" hidden></div>
        </div>

        <div class="controls">
          <div class="spoiler-control">
            <button id="spoilerToggle" class="spoiler-toggle" type="button" role="switch" aria-checked="false">
              <span class="spoiler-txt">Dölj resultat</span>
              <span class="spoiler-switch" aria-hidden="true"><span class="spoiler-state"></span><span class="spoiler-knob"></span></span>
            </button>
            <span class="spoiler-info" tabindex="0" role="button" aria-label="Vad gör Dölj resultat?">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
              <span class="spoiler-tip" role="tooltip">Döljer alla matchresultat från de senaste 24 timmarna så att du slipper spoilers.</span>
            </span>
          </div>
          <span id="syncBadge" class="sync-badge pending" title="Resultat hämtas automatiskt från ESPN">Hämtar…</span>
        </div>
      </div>
    </div>
  </header>

  <main id="view" class="container"></main>

  <footer class="foot">
    <p>Data: FIFA & Wikipedia · Resultat & statistik: <a href="https://www.espn.com/soccer/">ESPN</a> · Tider kan ändras – <a href="https://www.fifa.com/">FIFA.com</a></p>
  </footer>

  <script>
    /* Datakälla för resultat/tabeller.
       - backend satt: alltid-på-server med WebSocket-realtid (mål syns inom
         sekunder). Faller automatiskt tillbaka på den statiska filen nedan om
         servern är nere eller vaknar ur viloläge.
       - backend tom: rent statiskt läge (GitHub Pages), läser data/results.json
         som GitHub Actions uppdaterar.

       OBS: byt ut URL:en nedan mot den faktiska adressen Render visar efter
       deployen (Dashboard → tjänsten vm2026 → längst upp). Den är oftast
       https://vm2026.onrender.com men kan få ett suffix om namnet var upptaget. */
    window.VM_CONFIG = {
      backend: "https://vm2026-hpmo.onrender.com",
      staticResults: "data/results.json",
      staticDetails: "data/matchdetails.json",
      staticBracket: "data/bracket_probs.json",
      staticHighlights: "data/highlights.json"
    };
  </script>
  <script src="assets/annexc.js"></script>
  <script src="assets/r32engine.js?v=1"></script>
  <script src="assets/bracketengine.js?v=3"></script>
  <script src="assets/data.js?v=4"></script>
  <script src="assets/players.js?v=1"></script>
  <script src="assets/playerstats.js?v=8"></script>
  <script src="assets/app.js?v=103"></script>
  <script src="assets/syncSchedule.js"></script>
  <script src="assets/sync.js?v=3"></script>
  <script src="assets/live.js?v=8"></script>
  <script src="assets/matchinfo.js?v=10"></script>
</body>
</html>
