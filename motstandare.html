<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>VM 2026 – Motståndarsimulator</title>
  <meta name="description" content="Simulera gruppspelets sista matcher och se vem ditt lag kan möta i 1/16-finalen.">
  <meta name="theme-color" content="#0a1628">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/logo-spade.png?v=2" type="image/png" sizes="128x128">
  <link rel="apple-touch-icon" href="assets/logo-spade.png?v=2">
  <link rel="preconnect" href="https://flagcdn.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=174">
</head>
<body>
  <div class="site-bg" aria-hidden="true"></div>
  <header class="hero-header">
    <div class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/" title="Till startsidan" aria-label="Gräver grav – startsidan">
          <span class="brand-mark" aria-hidden="true">
            <img src="assets/logo-spade.png?v=1" width="36" height="36" alt="" decoding="async">
          </span>
          <span class="brand-txt"><b>Gräver grav</b><small>VM 2026 · Motståndare</small></span>
        </a>

        <div class="controls standalone-controls">
          <div class="spoiler-control">
            <button id="spoilerBtn" class="spoiler-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Spoilerskydd – välj hur mycket som visas">
              <span class="spoiler-btn-ic" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M12 3l7 3v5c0 4.5-3 8.4-7 9.6C8 19.4 5 15.5 5 11V6z"/><path d="M9.2 12.1l1.9 1.9 3.8-4"/></svg>
              </span>
              <span class="spoiler-btn-txt">Spoilerskydd</span>
              <span class="spoiler-btn-state" id="spoilerBtnState">Av</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="view" class="container"></main>

  <footer class="foot">
    <div class="foot-row">
      <span id="syncBadge" class="sync-badge pending" title="Resultat hämtas automatiskt från ESPN">Hämtar…</span>
      <p>Data: FIFA & Wikipedia · Resultat & statistik: <a href="https://www.espn.com/soccer/">ESPN</a> · Tider kan ändras – <a href="https://www.fifa.com/">FIFA.com</a></p>
    </div>
  </footer>

  <script>
    window.VM_CONFIG = {
      backend: "https://vm2026-hpmo.onrender.com",
      staticResults: "data/results.json",
      staticDetails: "data/matchdetails.json",
      staticBracket: "data/bracket_probs.json",
      staticHighlights: "data/highlights.json",
      standaloneView: "legacy-r32"
    };
  </script>
  <script src="assets/analytics.js?v=1"></script>
  <script src="assets/annexc.js"></script>
  <script src="assets/r32engine.js?v=1"></script>
  <script src="assets/bracketengine.js?v=5"></script>
  <script src="assets/data.js?v=5"></script>
  <script src="assets/app.js?v=121"></script>
  <script src="assets/syncSchedule.js"></script>
  <script src="assets/sync.js?v=3"></script>
  <script src="assets/live.js?v=8"></script>
</body>
</html>
