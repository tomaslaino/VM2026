services:
  - type: web
    name: vm2026
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: FD_COMPETITION
        value: WC
      - key: FD_SEASON
        value: "2026"
      - key: DATABASE_URL
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
