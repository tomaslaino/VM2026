services:
  - type: web
    name: vm2026
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: FD_COMPETITION
        value: WC
      - key: FD_SEASON
        value: "2026"
      # Hur ofta servern hämtar ESPN medan en match är live (sekunder).
      # Lägre = snabbare ställning på sidan. ESPN:s öppna API klarar 30s väl.
      - key: FD_POLL_LIVE_SECONDS
        value: "30"
      - key: DATABASE_URL
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
